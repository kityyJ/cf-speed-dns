name: Audit CDN website HTTPS

on:
  workflow_dispatch:
  schedule:
    - cron: "22 * * * *"
  push:
    branches: ["main"]
    paths:
      - "audit_websites.py"
      - ".github/workflows/audit_websites.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check all 30 IPs for both website hostnames
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: "5f62be379eeeaf9a9334c903c0b7f5ba" # Public zone ID, token remains in GitHub Secrets
        run: python audit_websites.py
