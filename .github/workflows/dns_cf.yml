name: dns_cf_push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "dnscf.py"
      - ".github/workflows/dns_cf.yml"

concurrency:
  group: cdn-jia-nz-dns
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate DNS updater
        run: |
          python -m compileall -q dnscf.py aggregate_ips.py tests
          python -m unittest discover -s tests -v

      - name: Refresh IP pool for this run
        run: python aggregate_ips.py

      - name: Update Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_DNS_NAME: cdn.jia.nz
          CF_DNS_RECORD_COUNT: "30"
          CF_DNS_MAX_ROTATIONS: "6"
          # HTTPS site check is diagnostic only; Runner != mainland China probe.
          CF_DNS_SITE_AUDIT_HOST: cook.jia.nz
          CF_DNS_SITE_AUDIT_PATH: "/"
          CF_DNS_SITE_AUDIT_COUNT: "3"
          # Only publish endpoints that serve cook.jia.nz with valid HTTPS SNI/Host.
          CF_DNS_SITE_VERIFY: "1"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python dnscf.py
