name: Refresh IP pools

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: ["main"]
    paths:
      - "aggregate_ips.py"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "aggregate_ips.py"
      - "sources.json"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-ip-pools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Aggregate IP pools
        run: python aggregate_ips.py

      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ipTop.html ipTop10.html api data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh aggregated IP pools"
          git pull --rebase origin main
          git push origin main
