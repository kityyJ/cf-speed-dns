<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Cloudflare IPv4 优选数据：电信、联通、移动与当前 DNS 解析。">
  <title>Cook 优选 · Cloudflare IP</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light;--bg:#f7f8fa;--panel:#fff;--ink:#1a2533;--muted:#788495;--border:#e7ebf1;--accent:#f47b2b;--accent-bg:#fff4eb;--green:#15966e;--green-bg:#e8f8ef;--shadow:0 8px 30px rgba(25,42,64,.045)}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141c;--panel:#1a222d;--ink:#eef2f7;--muted:#9aa6b4;--border:#303b4a;--accent:#ff9958;--accent-bg:#392b24;--green:#53d6a6;--green-bg:#1a382e;--shadow:0 8px 30px rgba(0,0,0,.18)}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;min-width:320px}button,input,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .site-header{background:var(--panel);border-bottom:1px solid var(--border)}.header-inner{width:min(1080px,calc(100% - 36px));margin:auto;height:67px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;font-size:17px;font-weight:800;letter-spacing:-.02em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#fff;background:linear-gradient(140deg,#ffac51,#f16f1a);font-size:21px;box-shadow:0 4px 13px rgba(247,119,34,.18)}.header-subtitle{color:var(--muted);font-size:12px;font-weight:550}
    .container{width:min(1080px,calc(100% - 36px));margin:54px auto 70px}.title-section{margin-bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.16em;font-weight:800}.title-section h1{font-size:clamp(29px,4.5vw,38px);line-height:1.2;margin:8px 0 7px;letter-spacing:-.04em}.title-section p{font-size:13px;line-height:1.75;color:var(--muted);margin:0}.auto-badge{border:1px solid var(--border);border-radius:50px;padding:8px 12px;background:var(--panel);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted);font-size:12px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#14b981;box-shadow:0 0 0 4px rgba(20,185,129,.09)}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:22px 24px 19px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:15px;align-items:center}.filters{display:flex;flex-wrap:wrap;gap:7px}.filter{background:transparent;border:1px solid transparent;border-radius:9px;color:var(--muted);padding:9px 12px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:7px}.filter:hover{color:var(--ink);background:var(--bg)}.filter.active{background:var(--accent-bg);color:var(--accent);border-color:rgba(244,123,43,.21)}.filter small{font-size:11px;font-weight:600;color:inherit;opacity:.75}
    .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{display:flex;align-items:center;gap:8px;min-width:190px;width:216px;border:1px solid var(--border);border-radius:9px;padding:0 12px;background:var(--panel);height:36px;color:var(--muted)}.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(244,123,43,.09)}.search input{color:var(--ink);background:transparent;border:0;outline:0;min-width:0;width:100%;font-size:12px}.search input::placeholder{color:var(--muted)}
    .btn{border:1px solid var(--border);border-radius:9px;white-space:nowrap;background:var(--panel);color:var(--ink);height:36px;padding:0 12px;font-size:12px;font-weight:650}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn-main{background:var(--accent);border-color:var(--accent);color:#fff}.btn-main:hover{filter:brightness(1.04);color:#fff}.btn:disabled{opacity:.55;cursor:wait}
    .table-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 24px 16px;color:var(--muted);font-size:12px}.table-meta strong{color:var(--ink)}.meta-hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .table-wrap{overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--border)}table{border-collapse:collapse;width:100%;min-width:810px;text-align:center}thead{background:var(--bg)}th{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.025em;text-align:center;padding:14px 12px;white-space:nowrap}td{border-top:1px solid var(--border);font-size:12px;padding:14px 12px;vertical-align:middle}tbody tr:hover{background:color-mix(in srgb,var(--bg) 58%,transparent)}th:first-child,td:first-child{width:58px;color:var(--muted)}th:nth-child(2){width:178px}th:nth-child(3){width:155px}th:nth-child(6){width:103px}th:nth-child(7){width:72px}
    .ip{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:740;white-space:nowrap;letter-spacing:-.015em}.tag{color:var(--muted);display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}.source{color:var(--ink);max-width:190px;display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:middle}.tags{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap}.line-pill{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-weight:650;font-size:11px;color:var(--muted)}.line-ct{color:#3684d5}.line-cu{color:#935fc8}.line-cmcc{color:#159b78}.line-none{color:var(--muted)}
    .state{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}.state:before{content:"";width:6px;height:6px;border-radius:50%;background:#bac3d0}.state.live{color:var(--green);font-weight:750}.state.live:before{background:var(--green)}.copy{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:750;padding:7px 5px}.copy:hover{text-decoration:underline}
    .empty{padding:60px 16px!important;color:var(--muted);font-size:13px}.pagination{border-top:1px solid var(--border);padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.pages{display:flex;align-items:center;gap:10px}.page-btn{background:var(--panel);color:var(--ink);border:1px solid var(--border);padding:7px 12px;border-radius:8px;font-size:12px}.page-btn:disabled{opacity:.35;cursor:not-allowed}.page-btn:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
    .bottom{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 4px 0;color:var(--muted);font-size:11px;line-height:1.6}.bottom a:hover{color:var(--accent)}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:10px;padding:11px 18px;box-shadow:var(--shadow);font-size:12px;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:950px){.toolbar{align-items:flex-start}.tools{width:100%}.search{flex:1;width:auto}.table-meta{padding-left:18px;padding-right:18px}}@media(max-width:650px){.header-inner,.container{width:calc(100% - 24px)}.header-inner{height:59px}.header-subtitle{font-size:10px}.container{margin:30px auto 45px}.title-section{align-items:flex-start;flex-direction:column;gap:13px}.title-section h1{font-size:30px}.toolbar{padding:15px 12px}.filters{gap:3px}.filter{padding:8px 10px;font-size:12px}.tools{gap:6px}.search{flex-basis:100%;max-width:none}.btn{flex:1}.table-meta{padding:7px 14px 12px}.pagination{padding:13px 14px;flex-wrap:wrap}.bottom{flex-direction:column;align-items:flex-start}.panel{border-radius:14px}}
    /* Compact top status bar; table starts immediately underneath. */
    .header-inner{height:auto;min-height:70px;flex-wrap:wrap;justify-content:flex-start}
    .header-summary{display:flex;align-items:baseline;gap:12px;flex:1;min-width:0}
    .header-summary h1{font-size:18px;line-height:1.25;margin:0;white-space:nowrap;letter-spacing:-.025em}
    .header-subtitle{font-size:12px;white-space:nowrap}
    .header-inner .auto-badge{margin-left:auto;font-size:11px;padding:7px 10px}
    .container{margin:22px auto 55px}
    .latency-ms{display:inline-block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:750;color:#11936e;white-space:nowrap;font-variant-numeric:tabular-nums}
    .latency-empty{color:var(--muted);font-weight:450}
    table{min-width:880px}
    th:nth-child(4){width:100px}
    th:nth-child(7){width:103px}
    th:nth-child(8){width:72px}
    @media(max-width:800px){
      .header-inner{padding-top:11px;padding-bottom:11px;gap:7px 12px}
      .header-summary{flex:1 1 calc(100% - 155px);flex-wrap:wrap;gap:3px 10px}
      .header-inner .auto-badge{margin-left:44px;font-size:10px}
      .header-subtitle{font-size:11px}
      .container{margin-top:16px}
    }
    @media(max-width:480px){
      .header-summary{flex-basis:calc(100% - 145px)}
      .header-summary h1{font-size:16px}
      .header-inner .auto-badge{margin-left:0}
      .header-subtitle{font-size:10px}
    }
  </style>
</head>
<body>
<header class="site-header"><div class="header-inner">
  <a class="brand" href="./" aria-label="Cook优选首页"><span class="brand-mark">☁</span>Cook优选</a>
  <div class="header-summary"><h1>优选 IP</h1><span class="header-subtitle">电信 · 联通 · 移动 · 当前 DNS</span></div>
  <div class="auto-badge"><i class="live-dot" aria-hidden="true"></i><span id="updated">数据更新：读取中…</span></div>
</div></header>
<main class="container">
  <section class="panel" aria-label="Cloudflare 优选 IP 表格">
    <div class="toolbar">
      <div class="filters" role="group" aria-label="线路筛选">
        <button class="filter active" data-filter="all" aria-pressed="true">全部 <small id="count-all">—</small></button>
        <button class="filter" data-filter="dns" aria-pressed="false">当前 DNS <small id="count-dns">—</small></button>
        <button class="filter" data-filter="ct" aria-pressed="false">电信 <small id="count-ct">—</small></button>
        <button class="filter" data-filter="cu" aria-pressed="false">联通 <small id="count-cu">—</small></button>
        <button class="filter" data-filter="cmcc" aria-pressed="false">移动 <small id="count-cmcc">—</small></button>
      </div>
      <div class="tools"><label class="search" aria-label="搜索 IP、来源或标签"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索 IP / 来源" autocomplete="off"></label><button type="button" class="btn" id="refresh">↻ 刷新</button><button type="button" class="btn" id="copy-all">复制 IP</button><button type="button" class="btn" id="export-txt">TXT</button><button type="button" class="btn btn-main" id="export-json">JSON</button></div>
    </div>
    <div class="table-meta"><span id="summary" role="status">正在拉取优选数据…</span><span id="dns-status" class="meta-hint">DNS 只读查询，不修改后台记录</span></div>
    <div class="table-wrap"><table><thead><tr><th>#</th><th>优选 IP</th><th>线路</th><th title="只有第三方来源提供 ms 时显示；不是即时测速">来源延迟 ⓘ</th><th>来源</th><th>标签</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">正在加载…</td></tr></tbody></table></div>
    <div class="pagination"><span id="page-summary">每页 30 条</span><div class="pages"><button class="page-btn" id="prev-page" type="button" disabled>上一页</button><span id="page-number">1 / 1</span><button class="page-btn" id="next-page" type="button" disabled>下一页</button></div></div>
  </section>
  <footer class="bottom"><span>IP 来自公开优选数据；「来源延迟」是上游历史参考值，未提供的 IP 不代表慢或不可用。</span><span>自动更新 · 来源延迟仅供参考，非实时测速 · 当前 DNS 仅供查询 · <a href="https://github.com/kityyJ/cook-speed-dns" target="_blank" rel="noopener noreferrer">GitHub ↗</a></span></footer>
</main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  "use strict";
  const G=["ct","cu","cmcc"],N={ct:"电信",cu:"联通",cmcc:"移动"};
  const PAGE_SIZE=30;
  let filter="all",query="",page=1,data=[],dnsIps=new Set(),sources={},loaded=false,loading=false,metaTimestamp="";
  const $=s=>document.querySelector(s);
  const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ipv4=ip=>{if(typeof ip!=="string")return false;const p=ip.split(".");return p.length===4&&p.every(v=>/^\d{1,3}$/.test(v)&&+v>=0&&+v<=255)};
  const toNumber=ip=>ip.split(".").reduce((v,n)=>v*256+Number(n),0);
  const sleepAbort=(ms)=>{const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);return {signal:c.signal,clear:()=>clearTimeout(timer)}};
  async function getJson(url,ms=9000){const c=sleepAbort(ms);try{const r=await fetch(url,{cache:"no-store",signal:c.signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}finally{c.clear()}}
  let toastTimer;
  function toast(text){const x=$("#toast");x.textContent=text;x.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove("show"),2100)}
  // Show upstream-reported milliseconds; not an on-demand network ping.
  function reportedLatency(tag){
    const found=String(tag??"").match(/\b(\d+(?:\.\d+)?)\s*ms\b/i);
    if(!found)return null;
    const ms=Number(found[1]);
    return Number.isFinite(ms)&&ms>0&&ms<3000?ms:null;
  }
  function safeGroupRows(payload,g){return Array.isArray(payload?.items)?payload.items.filter(x=>x&&ipv4(x.ip)).map((x,i)=>({ip:x.ip,port:Number(x.port)||443,group:g,rank:i,source:String(x.source??""),tag:String(x.tag??""),latencyMs:reportedLatency(x.tag)})):[]}
  async function queryDNS(){
    const urls=["https://cloudflare-dns.com/dns-query?name=cdn.yigeyao.com&type=A","https://dns.google/resolve?name=cdn.yigeyao.com&type=A"];
    for(const url of urls){try{const c=sleepAbort(5500);try{const r=await fetch(url,{cache:"no-store",headers:url.includes("cloudflare-dns")?{"Accept":"application/dns-json"}:{},signal:c.signal});if(!r.ok)continue;const j=await r.json();if(j.Status!==0)continue;const ips=(j.Answer||[]).filter(x=>x.type===1&&ipv4(x.data)).map(x=>x.data);if(ips.length)return {ips:[...new Set(ips)],resolver:url.includes("cloudflare-dns")?"Cloudflare DoH":"Google DoH"}}finally{c.clear()}}catch(e){/* Resolver may be blocked; use fallback. */}}
    return {ips:[],resolver:"查询失败（可能受本地网络限制）"};
  }
  async function reload(){
    if(loading)return;loading=true;loaded=false;$("#refresh").disabled=true;$("#summary").textContent="正在拉取优选 IP 与 DNS 数据…";
    const results=await Promise.allSettled([...G.map(g=>getJson(`./api/${g}.json`)),getJson("./api/all.json"),getJson("./data/status.json"),queryDNS()]);
    const newRows={};let available=0;
    G.forEach((g,i)=>{if(results[i].status==="fulfilled"){newRows[g]=safeGroupRows(results[i].value,g);available++}else newRows[g]=[]});
    let fallback=[];if(results[3].status==="fulfilled")fallback=safeGroupRows(results[3].value,"all");
    sources=newRows;
    const dnsResult=results[5].status==="fulfilled"?results[5].value:{ips:[],resolver:"查询失败"};
    dnsIps=new Set(dnsResult.ips);
    $("#dns-status").textContent=`DNS：${dnsIps.size?dnsIps.size+" 条 · "+dnsResult.resolver:"暂不可用"} · 只读`;
    const m=new Map();let order=0;
    const insert=(item)=>{
      if(!ipv4(item.ip))return;
      const k=item.ip;let row=m.get(k);
      if(!row){row={ip:k,port:item.port||443,lines:new Set(),source:item.source||"—",tag:item.tag||"—",latencyMs:item.latencyMs??null,order:order++};m.set(k,row)}
      if(G.includes(item.group))row.lines.add(item.group);
      if(row.source==="—"&&item.source)row.source=item.source;
      if(row.tag==="—"&&item.tag)row.tag=item.tag;
      if(row.latencyMs===null&&item.latencyMs!=null)row.latencyMs=item.latencyMs;
    };
    for(const g of G)for(const item of newRows[g])insert(item);
    if(available===0)for(const item of fallback)insert(item);
    for(const ip of dnsIps)insert({ip,port:443,group:"dns",source:"Cloudflare DNS",tag:"已在解析池"});
    // Favor IPs with explicit upstream latency so the first page is informative.
    // DNS-only records remain fully available under the "当前 DNS" filter.
    data=[...m.values()].sort((a,b)=>Number(b.latencyMs!==null)-Number(a.latencyMs!==null)||Number(dnsIps.has(b.ip))-Number(dnsIps.has(a.ip))||a.order-b.order||toNumber(a.ip)-toNumber(b.ip));
    const st=results[4].status==="fulfilled"?results[4].value:null;
    metaTimestamp=st?.generated_at||"";
    $("#updated").textContent=metaTimestamp?"数据更新："+metaTimestamp:"数据更新时间未知";
    $("#count-all").textContent=data.length;
    $("#count-dns").textContent=dnsIps.size;
    for(const g of G)$("#count-"+g).textContent=new Set(newRows[g].map(x=>x.ip)).size;
    loaded=true;loading=false;$("#refresh").disabled=false;page=1;
    render();
    if(available===0&&!fallback.length)toast("优选源暂不可用，DNS 数据可能仍可查看");
  }
  function filtered(){return data.filter(row=>{
    if(filter==="dns"&&!dnsIps.has(row.ip))return false;
    if(G.includes(filter)&&!row.lines.has(filter))return false;
    if(query){const hay=[row.ip,row.source,row.tag,[...row.lines].map(g=>N[g]).join(" "),dnsIps.has(row.ip)?"解析中":"候选"].join(" ").toLowerCase();if(!hay.includes(query))return false}
    return true;
  })}
  function render(){
    const rows=filtered();const totalPages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));page=Math.min(page,totalPages);
    const start=(page-1)*PAGE_SIZE;
    const table=rows.slice(start,start+PAGE_SIZE);
    $("#rows").innerHTML=table.map((row,i)=>{
      const labels=[...row.lines].sort((a,b)=>G.indexOf(a)-G.indexOf(b));
      const lines=labels.length?labels.map(g=>`<span class="line-pill line-${g}">${N[g]}</span>`).join(""):'<span class="line-pill line-none">通用</span>';
      const online=dnsIps.has(row.ip);
      const latency=row.latencyMs===null
        ?'<span class="latency-empty" title="上游没有提供延迟；这不代表 IP 不可用">未提供</span>'
        :'<span class="latency-ms" title="数据源标注延迟，并非实时测速">'+esc(String(row.latencyMs))+' ms</span>';
      return `<tr><td>${start+i+1}</td><td><span class="ip">${esc(row.ip)}</span></td><td><div class="tags">${lines}</div></td><td>${latency}</td><td><span class="source" title="${esc(row.source)}">${esc(row.source)}</span></td><td><span class="tag" title="${esc(row.tag)}">${esc(row.tag)}</span></td><td><span class="state ${online?"live":""}">${online?"当前解析":"候选"}</span></td><td><button class="copy" type="button" data-ip="${esc(row.ip)}" aria-label="复制 ${esc(row.ip)}">复制</button></td></tr>`;
    }).join("")||`<tr><td colspan="8" class="empty">${loaded?"没有符合条件的 IP":"正在载入数据…"}</td></tr>`;
    const measured=rows.reduce((total,row)=>total+(row.latencyMs!==null?1:0),0);
    $("#summary").innerHTML=`共 <strong>${rows.length}</strong> 条 · <strong>${measured}</strong> 条有来源延迟${query?" · 搜索结果":""}${rows.length?` · 显示 ${start+1}–${Math.min(start+PAGE_SIZE,rows.length)}`:""}`;
    $("#summary").title="未显示延迟的 IP 是上游未提供数据；网页没有对单个 IP 进行实时网络测速。";
    $("#page-summary").textContent=`每页 ${PAGE_SIZE} 条`;
    $("#page-number").textContent=page+" / "+totalPages;
    $("#prev-page").disabled=page<=1;$("#next-page").disabled=page>=totalPages;
  }
  async function copy(text){try{await navigator.clipboard.writeText(text);toast("已复制到剪贴板")}catch(e){toast("复制失败，请检查浏览器剪贴板权限")}}
  function download(type){const rows=filtered();if(!rows.length)return toast("当前没有可导出数据");const contents=type==="txt"?rows.map(r=>r.ip).join("\n")+"\n":JSON.stringify({count:rows.length,generated_at:metaTimestamp,items:rows.map(r=>({ip:r.ip,port:r.port,carriers:[...r.lines],source:r.source,tag:r.tag,latency_ms:r.latencyMs,in_dns:dnsIps.has(r.ip)}))},null,2);const blob=new Blob([contents],{type:type==="json"?"application/json;charset=utf-8":"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`cloudflare-ip-${filter}.${type}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{filter=btn.dataset.filter;page=1;for(const el of document.querySelectorAll(".filter")){const on=el===btn;el.classList.toggle("active",on);el.setAttribute("aria-pressed",String(on))}render()}));
  $("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();page=1;render()});
  $("#rows").addEventListener("click",e=>{const btn=e.target.closest("button[data-ip]");if(btn)copy(btn.dataset.ip)});
  $("#prev-page").addEventListener("click",()=>{page--;render()});$("#next-page").addEventListener("click",()=>{page++;render()});
  $("#refresh").addEventListener("click",reload);
  $("#copy-all").addEventListener("click",()=>{const r=filtered();if(!r.length)return toast("当前没有可复制的 IP");copy(r.map(x=>x.ip).join("\n"))});
  $("#export-txt").addEventListener("click",()=>download("txt"));$("#export-json").addEventListener("click",()=>download("json"));
  reload();
})();
</script>
</body></html>
